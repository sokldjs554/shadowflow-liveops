name: bootstrap-shadowflow

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand staged ShadowFlow source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          {
            head -c 15000 .bootstrap/payload.part00
            cat .bootstrap/payload.part01
            cat .bootstrap/payload.part02
            cat .bootstrap/fix030a
            cat .bootstrap/fix030b0
            cat .bootstrap/fix030b1
            cat .bootstrap/fix031
            cat .bootstrap/fix032
            cat .bootstrap/payload.part04
            head -c 15000 .bootstrap/payload.part05
            cat .bootstrap/payload.part06
          } > /tmp/shadowflow.b64
          test "$(wc -c < /tmp/shadowflow.b64)" -eq 99408
          base64 -d /tmp/shadowflow.b64 > /tmp/shadowflow.tar.xz
          xz -t /tmp/shadowflow.tar.xz
          rm -rf /tmp/shadowflow-src
          mkdir -p /tmp/shadowflow-src
          tar -xJf /tmp/shadowflow.tar.xz -C /tmp/shadowflow-src
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/shadowflow-src/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build ShadowFlow workflow compiler"
          git push
