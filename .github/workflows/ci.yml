name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check shadowflow tests synthetic_app
      - run: python -m mypy shadowflow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save typescript@5.8.3
      - run: ./node_modules/.bin/tsc -p web/tsconfig.json --noEmit
      - run: python -m shadowflow.cli demo > /tmp/shadowflow-packet.json
      - name: Verify demo verdict
        run: python -c 'import json; p=json.load(open("/tmp/shadowflow-packet.json")); assert p["verdict"] == "ready_with_approval" and p["metrics"]["shadow_passed"] == p["metrics"]["shadow_variants"]'
